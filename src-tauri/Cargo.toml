[package]
name = "anypctoolbox"
version = "1.0.0"
description = "AnyPCToolbox - A multi-tool utility box"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "anypctoolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2" }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
