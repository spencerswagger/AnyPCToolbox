name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1. 先创建 draft Release，避免各 job 并发创建竞态；后续 job 向同一 draft 追加制品
  create-draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true

  # 2. 六平台桌面构建 + Updater 签名
  publish-tauri:
    needs: create-draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: '--target aarch64-unknown-linux-gnu'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # 制品文件名与 updater 清单版本均来自 tauri.conf.json 的 version；
      # 用 tag(去掉前导 v) 对齐，避免出现标签 v0.0.2 而制品带 1.0.0 的不一致
      # 版本以 env 注入并在 node 内处理，跨平台一致(避免 bash/pwsh 差异)
      - name: Align version to tag
        env:
          TAG: ${{ github.ref_name }}
        run: node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const tag = process.env.TAG
            const ver = tag.replace(/^v/, "")
            const file = "src-tauri/tauri.conf.json"
            const out = readFileSync(file, "utf8").replace(
              /"version"\s*:\s*"[^"]+"/,
              `"version": "${ver}"`,
            )
            writeFileSync(file, out)
            console.log("tauri.conf.json version -> " + ver)
          '

      - name: Inject updater endpoint from GitHub variable
        env:
          UPDATER_BASE_URL: ${{ vars.UPDATER_BASE_URL }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const base = process.env.UPDATER_BASE_URL
            if (!base) {
              console.error("::error::缺少 UPDATER_BASE_URL 仓库变量(下载站根目录，如 http://download.example.com/anypctoolbox/)")
              process.exit(1)
            }
            const file = "src-tauri/tauri.conf.json"
            const endpoint = base.replace(/\/+$/, "") + "/updater.json"
            const next = readFileSync(file, "utf8").replace(
              "https://updates.anypctoolbox.example.com/updater.json",
              endpoint,
            )
            if (next.indexOf(endpoint) < 0) {
              console.error("::error::未找到占位 endpoint，无法注入")
              process.exit(1)
            }
            writeFileSync(file, next)
            console.log("endpoint -> " + endpoint)
          '

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # 3. Web 静态资源打包上传（version.json 一并打进去，release 不再单独上传）
  upload-web:
    needs: create-draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Generate version.json into web dist
        run: |
          node scripts/generate-update-artifacts.js "${GITHUB_REF_NAME}"
          cp dist-version/version.json dist/version.json

      - name: Package web dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -r "../anypctoolbox-web-v${VERSION}.zip" .

      - name: Upload web zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: anypctoolbox-web-v*.zip

  # 4. 重写桌面端 updater.json 的各平台 url 为 baseurl + 文件名，并上传到 release
  finalize-updater-json:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'latest.json' --clobber

      - name: Rewrite updater.json URLs
        env:
          UPDATER_BASE_URL: ${{ vars.UPDATER_BASE_URL }}
        run: |
          if [ -z "${UPDATER_BASE_URL}" ]; then
            echo "::error::缺少 UPDATER_BASE_URL 仓库变量，无法改写 updater.json 的下载地址"
            exit 1
          fi
          node scripts/rewrite-updater-json.js latest.json updater.json "$UPDATER_BASE_URL" "$GITHUB_REF_NAME"

      - name: Upload updater.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" updater.json --clobber

      # release 只保留部署下载站所需内容；latest.json(指向 GitHub 的原始清单) 已由 updater.json 取代
      - name: Remove redundant latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" latest.json --yes
