name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  generate-updater-json:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate update artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || 'https://cdn.example.com/releases' }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          node scripts/generate-update-artifacts.js

      - name: Upload update artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/updater.json
            release-artifacts/version.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tauri:
    needs: generate-updater-json
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          target: ${{ matrix.target }}
          tauriConfig: |
            {
              "build": {
                "beforeDevCommand": "npm run dev",
                "beforeBuildCommand": "npm run build",
                "devUrl": "http://localhost:1420",
                "frontendDist": "../dist"
              },
              "bundle": {
                "active": true,
                "icon": [
                  "icons/32x32.png",
                  "icons/128x128.png",
                  "icons/128x128@2x.png",
                  "icons/icon.icns",
                  "icons/icon.ico"
                ],
                "targets": "all"
              },
              "app": {
                "windows": [
                  {
                    "title": "AnyPCToolbox",
                    "width": 800,
                    "height": 600
                  }
                ]
              },
              "updater": {
                "active": true,
                "endpoints": [
                  "${{ vars.DOWNLOAD_BASE_URL || 'https://cdn.example.com' }}/updater.json"
                ],
                "timeout": 10,
                "dialog": true
              }
            }

  upload-web:
    needs: [generate-updater-json, publish-tauri]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Archive web assets
        run: zip -r anypctoolbox-web-${{ github.ref_name }}.zip dist/

      - name: Upload web assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: anypctoolbox-web-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-update-server:
    needs: [generate-updater-json, publish-tauri, upload-web]
    runs-on: ubuntu-22.04
    if: env.DEPLOY_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}

      - name: Deploy to update server
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/updates' }}
        run: |
          echo "Deploying update artifacts to $DEPLOY_HOST:$DEPLOY_PATH"
          # scp or rsync deployment
          # sshpass -p "$DEPLOY_TOKEN" scp -r release-artifacts/ $DEPLOY_HOST:$DEPLOY_PATH/
